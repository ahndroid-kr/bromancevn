<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만 나를 좋아해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2C2A36; --paper:#FBF6EE; --paper-edge:#ECE2D4;
    --persimmon:#E07A4E;  /* 자신감 */
    --teal:#2F8F86;       /* 실무력 */
    --gold:#D8A23C;       /* 팀워크 */
    --plum:#241F30; --muted:#8B8597;
    --display:'Gowun Batang','Apple SD Gothic Neo',serif;
    --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body); color:var(--ink); background:#15121C;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  /* 무대: 16:9에 가깝게, 모바일에선 꽉 차게 */
  #stage{
    position:fixed; inset:0; display:flex; flex-direction:column;
    height:100dvh; height:100vh;
  }

  /* ── 장면(배경) ── */
  #scene{position:relative; flex:1; overflow:hidden; transition:background .5s ease}
  #scene .bg-label{
    position:absolute; bottom:12px; left:14px; z-index:5;
    font-size:12px; letter-spacing:.08em; color:rgba(255,255,255,.55);
    background:rgba(0,0,0,.18); padding:4px 12px; border-radius:99px; backdrop-filter:blur(4px);
  }
  /* 배경 실제 이미지가 들어가면 이 img가 박스를 덮음 */
  #bgImg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none}

  /* ── 캐릭터(스프라이트) ── */
  #sprite-wrap{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    display:flex; align-items:flex-end; justify-content:center;
    width:min(70%,420px); height:78%;
    transition:opacity .35s ease, transform .35s ease;
  }
  #spritePlaceholder{
    width:100%; max-width:300px; aspect-ratio:3/4; align-self:center;
    border:2px dashed rgba(255,255,255,.5); border-radius:18px;
    background:rgba(255,255,255,.06);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:#fff;
  }
  #spritePlaceholder .ring{
    width:74px;height:74px;border-radius:50%;border:3px solid #fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);
    font-size:30px;font-weight:700;
  }
  #spritePlaceholder .pl-name{font-family:var(--display); font-size:19px}
  #spritePlaceholder .pl-tag{font-size:11px; opacity:.7; letter-spacing:.05em}
  #spriteImg{max-height:100%; display:none}
  .sprite-hidden{opacity:0; transform:translateX(-50%) translateY(12px)}

  /* ── 상단 챕터 바 ── */
  #topbar{
    position:absolute; top:0; left:0; right:0; min-height:42px;
    display:flex; align-items:flex-start; padding:11px 16px 8px;
    font-size:12.5px; letter-spacing:.05em; color:rgba(255,255,255,.75);
    background:linear-gradient(to bottom, rgba(20,15,28,.6) 60%, transparent);
    z-index:5; pointer-events:none;
  }
  #chapterLabel{ max-width:calc(100% - 178px); line-height:1.34; }

  /* ── 성장 카드(시그니처 HUD) ── */
  #hud{
    position:absolute; top:48px; right:14px; z-index:6;
    width:178px; background:rgba(251,246,238,.94); border-radius:14px;
    padding:11px 13px 13px; box-shadow:0 6px 22px rgba(0,0,0,.28);
    border:1px solid var(--paper-edge);
  }
  #hud h3{font-family:var(--display); font-size:13px; color:var(--ink); margin-bottom:9px; letter-spacing:.02em}
  #hud h3 b{color:var(--persimmon)}
  .stat{margin-bottom:8px}
  .stat:last-child{margin-bottom:0}
  .stat .row{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:3px}
  .stat .row b{color:var(--ink); font-weight:400}
  .bar{height:7px; border-radius:99px; background:#E9E0D2; overflow:hidden}
  .bar > i{display:block; height:100%; width:0%; border-radius:99px; transition:width .55s cubic-bezier(.3,.9,.3,1)}
  .s-conf > i{background:var(--persimmon)}
  .s-skill > i{background:var(--teal)}
  .s-team > i{background:var(--gold)}
  .toast{
    position:absolute; right:0; font-family:var(--display); font-size:13px; font-weight:700;
    opacity:0; pointer-events:none;
  }
  @keyframes floatUp{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}

  /* ── 대사창 ── */
  #dialogue{
    position:relative; flex:0 0 auto; min-height:166px;
    background:var(--paper); border-top:3px solid var(--persimmon);
    padding:26px 26px calc(20px + env(safe-area-inset-bottom)); cursor:pointer;
    box-shadow:0 -10px 30px rgba(0,0,0,.35);
  }
  #nametag{
    position:absolute; top:-16px; left:24px;
    font-family:var(--display); font-weight:700; font-size:15px; color:#fff;
    background:var(--persimmon); padding:5px 16px; border-radius:9px 9px 0 9px;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  #nametag.hide{display:none}
  #text{font-size:17.5px; line-height:1.72; color:var(--ink); min-height:3.4em; word-break:keep-all}
  #text.narration{color:#56525F; font-style:italic}
  #next{position:absolute; right:22px; bottom:16px; color:var(--persimmon); font-size:14px; opacity:0; animation:blink 1.1s infinite}
  @keyframes blink{50%{opacity:.25}}
  #next.show{opacity:1}

  /* ── 선택지 ── */
  #choices{
    position:absolute; inset:0; display:none; flex-direction:column; gap:13px;
    align-items:center; justify-content:center; padding:22px;
    background:linear-gradient(to top, rgba(20,15,28,.78), rgba(20,15,28,.42));
    z-index:8;
  }
  #choices.show{display:flex}
  .choice{
    width:min(560px,92%); font-family:var(--body); font-size:16px; color:var(--ink);
    background:var(--paper); border:1px solid var(--paper-edge); border-left:5px solid var(--persimmon);
    padding:15px 20px; border-radius:11px; cursor:pointer; text-align:left;
    transition:transform .12s ease, box-shadow .15s ease; word-break:keep-all;
  }
  .choice:hover,.choice:focus-visible{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.3); outline:none}

  /* ── 타이틀 / 엔드 오버레이 ── */
  .screen{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    background:radial-gradient(120% 90% at 50% 18%, #34263A 0%, #1C1626 60%, #14101C 100%);
    color:var(--paper);
  }
  .screen.hide{display:none}
  .kicker{font-size:13px; letter-spacing:.32em; color:var(--gold); margin-bottom:18px}
  .title{font-family:var(--display); font-weight:700; font-size:clamp(34px,9vw,58px); line-height:1.08; letter-spacing:.01em}
  .title .small{display:block; font-size:.42em; color:var(--persimmon); margin-bottom:6px; letter-spacing:.04em}
  .subtitle{margin-top:18px; color:#C9C1D6; font-size:15px; max-width:380px; line-height:1.7; word-break:keep-all}
  .btn{
    margin-top:34px; font-family:var(--display); font-size:18px; color:#fff;
    background:var(--persimmon); border:none; padding:14px 42px; border-radius:99px; cursor:pointer;
    box-shadow:0 8px 20px rgba(224,122,78,.4); transition:transform .12s ease;
  }
  .btn:hover,.btn:focus-visible{transform:translateY(-2px); outline:none}
  .btn.ghost{background:transparent; border:1.5px solid rgba(255,255,255,.4); box-shadow:none; font-size:15px; padding:11px 28px}

  /* 챕터 카드 */
  #chapterCard{
    position:absolute; inset:0; z-index:15; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:rgba(20,15,28,.82); cursor:pointer; text-align:center; padding:30px;
  }
  #chapterCard.show{display:flex}
  #chapterCard .cc-k{font-size:14px; letter-spacing:.3em; color:var(--gold); margin-bottom:14px}
  #chapterCard .cc-t{font-family:var(--display); font-weight:700; font-size:clamp(28px,7vw,46px); color:var(--paper); line-height:1.2}

  /* 엔드 스탯 요약 */
  .end-stats{margin-top:26px; width:min(330px,86%); text-align:left}
  .end-stats .es{margin-bottom:14px}
  .end-stats .es .lab{display:flex; justify-content:space-between; font-size:13px; color:#C9C1D6; margin-bottom:5px}
  .end-stats .bar{background:rgba(255,255,255,.12)}
  .end-stats .bar > i{width:0%}

  .resetbtn{
    position:absolute; top:50px; left:14px; z-index:6;
    background:rgba(20,15,28,.4); color:rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.25);
    font-family:var(--body); font-size:11px; padding:5px 11px; border-radius:99px; cursor:pointer;
  }

  @media (max-width:480px){
    #hud{width:150px; top:44px; right:10px; padding:9px 11px}
    #text{font-size:16px}
    #dialogue{padding:24px 18px calc(18px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.05s !important}
  }
</style>

<div id="stage">
  <div id="scene">
    <img id="bgImg" alt="">
    <div class="bg-label" id="bgLabel">[배경]</div>
    <div id="topbar"><span id="chapterLabel"></span></div>
    <button class="resetbtn" id="resetBtn">처음부터</button>

    <!-- 성장 카드 (시그니처) -->
    <div id="hud">
      <h3>송쌩무이 <b>성장</b></h3>
      <div class="stat">
        <div class="row"><span>자신감</span><b id="vConf">0</b></div>
        <div class="bar s-conf"><i id="bConf"></i></div>
        <span class="toast" id="tConf" style="color:var(--persimmon)"></span>
      </div>
      <div class="stat">
        <div class="row"><span>실무력</span><b id="vSkill">0</b></div>
        <div class="bar s-skill"><i id="bSkill"></i></div>
        <span class="toast" id="tSkill" style="color:var(--teal)"></span>
      </div>
      <div class="stat">
        <div class="row"><span>팀워크</span><b id="vTeam">0</b></div>
        <div class="bar s-team"><i id="bTeam"></i></div>
        <span class="toast" id="tTeam" style="color:var(--gold)"></span>
      </div>
    </div>

    <!-- 캐릭터 -->
    <div id="sprite-wrap" class="sprite-hidden">
      <img id="spriteImg" alt="">
      <div id="spritePlaceholder">
        <div class="ring" id="plRing">?</div>
        <div class="pl-name" id="plName">캐릭터</div>
        <div class="pl-tag">[일러스트 자리 — PNG 교체]</div>
      </div>
    </div>

    <!-- 챕터 카드 -->
    <div id="chapterCard">
      <div class="cc-k" id="ccK"></div>
      <div class="cc-t" id="ccT"></div>
    </div>
  </div>

  <!-- 대사창 -->
  <div id="dialogue">
    <span id="nametag">이름</span>
    <p id="text"></p>
    <span id="next">▼</span>
  </div>

  <!-- 선택지 -->
  <div id="choices"></div>
</div>

<!-- 타이틀 -->
<div class="screen" id="titleScreen">
  <div class="kicker">사내 성장물</div>
  <h1 class="title"><span class="small">최수혁 책임의 쏭쌩무이 멘토링 분투기</span>나만 나를 좋아해</h1>
  <p class="subtitle">여친도 없고, 요즘 들어 도통 일도 안 풀리는 송성무.<br>왜, 어째서 나만 나를 좋아해!!</p>
  <button class="btn" id="startBtn">시작하기</button>
</div>

<!-- 엔딩(데모 종료) -->
<div class="screen hide" id="endScreen">
  <div class="kicker" id="endKicker">엔딩</div>
  <h1 class="title" id="endTitle" style="font-size:clamp(28px,7vw,46px)">엔딩</h1>
  <p class="subtitle" id="endBlurb"></p>
  <div class="end-stats">
    <div class="es"><div class="lab"><span>자신감</span><b id="eConf">0</b></div><div class="bar"><i id="ebConf" style="background:var(--persimmon)"></i></div></div>
    <div class="es"><div class="lab"><span>실무력</span><b id="eSkill">0</b></div><div class="bar"><i id="ebSkill" style="background:var(--teal)"></i></div></div>
    <div class="es"><div class="lab"><span>팀워크</span><b id="eTeam">0</b></div><div class="bar"><i id="ebTeam" style="background:var(--gold)"></i></div></div>
  </div>
  <button class="btn ghost" id="restartBtn">다시 처음부터</button>
</div>

  /* ── 제2화: 안현진 & 강지원 — 맞는 말과 듣기 좋은 말 ── */
  c2card:{ chapter:"제2화 · 맞는 말과 듣기 좋은 말", chapterCard:{k:"제 2 화", t:"맞는 말과 듣기 좋은 말"}, bg:"office", next:"c2_1" },
  c2_1:{ bg:"office", sprite:null, speaker:null,
         text:"송성무가 새 기획안을 올리는 날. 검토석엔 안현진 책임이 안경을 고쳐 쓰며 앉아 있었다.", next:"c2_2" },
  c2_2:{ sprite:"ahn", speaker:"ahn",
         text:"이 부분, 근거가 없잖아요. ‘좋을 것 같다’는 건 기획이 아니라 그냥 느낌이고요.", next:"c2_3" },
  c2_3:{ sprite:"song", speaker:"song", face:"anxious",
         text:"…죄송합니다. 다시 해오겠습니다.", next:"c2_4" },
  c2_4:{ sprite:"kang", speaker:"kang",
         text:"현진 책임님 피드백 진짜 날카롭다… 저는 다 맞는 말 같아서 그냥 다 받아 적었어요. 아~ 그렇구나, 하고요.", next:"c2_4b" },
  c2_4b:{ sprite:"ahn", speaker:"ahn",
          text:"받아 적을 시간에 한 줄이라도 고쳐 와요. ……그리고 이번 회식 메뉴는 오징어회로 하죠. 이건 양보 안 합니다.", next:"c2_5" },
  c2_5:{ sprite:null, speaker:null,
         text:"독설 끝에 갑자기 오징어회라니. 강지원처럼 다 받아들여야 할지, 휘둘리지 말아야 할지. 송성무는 혼란스러워 보였다.", next:"c2_6" },
  c2_6:{ sprite:"choi", speaker:"choi",
         text:"(송쌩무이가 현진 책임 말에 완전히 눌렸네. 어떻게 잡아줄까.)", next:"c2Choice" },
  c2Choice:{ sprite:"choi", speaker:"choi", text:"(뭐라고 해줄까…)",
    choices:[
      { label:"“지적받은 건 빠짐없이 반영해서 완성도부터 끌어올려.”", effect:{skill:2}, next:"c2_a1" },
      { label:"“근거 있는 부분은 지켜. 다 수용할 필욘 없어.”",       effect:{conf:2},  next:"c2_b1" },
      { label:"“안책임님한테 직접 물어보고 같이 다듬어.”",          effect:{team:2},  next:"c2_c1" },
    ]},
  c2_a1:{ sprite:"choi", speaker:"choi",
          text:"감정은 빼고, 지적된 항목만 리스트로 만들어서 하나씩 메워. 그게 제일 빠른 길이야.", next:"c2_a2" },
  c2_a2:{ sprite:"song", speaker:"song",
          text:"…네. 전부 고쳐서 다시 올리겠습니다.", next:"c2_end" },
  c2_b1:{ sprite:"choi", speaker:"choi",
          text:"안책임님이 깐 건 네 인격이 아니라 이 문서야. 맞다고 보는 건 ‘이래서 이렇게 봤습니다’ 하고 지켜도 돼.", next:"c2_b2" },
  c2_b2:{ sprite:"song", speaker:"song", face:"smile",
          text:"제 의견을… 말해도 되는 거였군요.", next:"c2_end" },
  c2_c1:{ sprite:"choi", speaker:"choi",
          text:"혼자 끙끙대지 말고 안책임한테 직접 가서 물어. 그 사람 독설 뒤엔 보통 답이 있어.", next:"c2_c2" },
  c2_c2:{ sprite:null, speaker:null,
          text:"송성무가 안현진에게 다가갔다.", next:"c2_c3" },
  c2_c3:{ sprite:"ahn", speaker:"ahn",
          text:"…물어보러 온 건 처음이네요. 좋아요. 여기 이 가설부터 다시 봅시다. 끝나면 오징어회는 송 매니저가 사고요.", next:"c2_end" },
  c2_end:{ sprite:null, speaker:null,
           text:"송성무는 깨달았다. 비판은 무너지라는 말이 아니라, 고치면 통과시켜 주겠다는 뜻이라는 걸.", next:"c3card" },

  /* ── 제3화: 노경덕 & 주다영 — 혼자 잘하는 것과 같이 잘하는 것 ── */
  c3card:{ chapter:"제3화 · 혼자 잘하는 것과 같이 잘하는 것", chapterCard:{k:"제 3 화", t:"혼자 잘하는 것과 같이 잘하는 것"}, bg:"office", next:"c3_1" },
  c3_1:{ bg:"office", sprite:null, speaker:null,
         text:"프로젝트가 타 부서 협조에서 막혔다. 메일을 세 번 보냈지만 답이 없었다.", next:"c3_2" },
  c3_2:{ sprite:"song", speaker:"song", face:"anxious",
         text:"제가 메일을 잘못 썼나 봐요. 계속 답이 없어서…", next:"c3_3" },
  c3_3:{ sprite:"noh", speaker:"noh",
         text:"메일로 안 되면 발로 가야지. 송 매니저, 따라와 봐요. 커피 두 잔 들고.", next:"c3_4" },
  c3_4:{ sprite:null, speaker:null,
         text:"노경덕은 타 부서 사람들과 농담을 주고받으며, 막혔던 일을 십 분 만에 풀어냈다.", next:"c3_4b" },
  c3_4b:{ sprite:"noh", speaker:"noh",
          text:"거 봐. 사람은 얼굴 보고 부탁하는 거야. …나 이거 끝나면 칼퇴야. 퇴근길에 편의점 들러서 와이프 줄 하이네켄 한 캔 사가는 게 내 낙이거든.", next:"c3_5" },
  c3_5:{ sprite:"song", speaker:"song",
         text:"…어떻게 저렇게 쉽게 푸시는 거죠.", next:"c3_6" },
  c3_6:{ sprite:"joo", speaker:"joo",
         text:"일 잘하는 사람은 일을 잘 미루는 사람이 아니라, 일을 잘 맡기는 사람이야.", next:"c3_7" },
  c3_7:{ sprite:"choi", speaker:"choi",
         text:"(송쌩무이가 ‘혼자 다 해야 한다’는 틀에 갇혀 있어. 풀어줘야겠다.)", next:"c3Choice" },
  c3Choice:{ sprite:"choi", speaker:"choi", text:"(어떻게 도와줄까…)",
    choices:[
      { label:"“상대가 바로 OK 하게, 자료부터 완벽히 준비해서 들어가.”", effect:{skill:2}, next:"c3_a1" },
      { label:"“네 입으로 직접 왜 필요한지 말해봐.”",                effect:{conf:2},  next:"c3_b1" },
      { label:"“경덕 책임님이랑 같이 가서 도움을 청해. 혼자 안 해도 돼.”", effect:{team:2}, next:"c3_c1" },
    ]},
  c3_a1:{ sprite:"choi", speaker:"choi",
          text:"부탁할 거면 상대가 망설일 틈이 없게 해. 필요한 자료를 다 정리해서 들고 가는 거지.", next:"c3_a2" },
  c3_a2:{ sprite:"song", speaker:"song",
          text:"준비가 곧 설득이군요. 정리해서 다시 가보겠습니다.", next:"c3_end" },
  c3_b1:{ sprite:"choi", speaker:"choi",
          text:"메일 말고 직접. 네 입으로 ‘이게 왜 필요한지’ 말해봐. 사람들, 생각보다 잘 도와줘.", next:"c3_b2" },
  c3_b2:{ sprite:"song", speaker:"song",
          text:"…떨리지만, 직접 가서 말해보겠습니다.", next:"c3_end" },
  c3_c1:{ sprite:"choi", speaker:"choi",
          text:"경덕 책임님 데리고 같이 가. 도움 청하는 것도 능력이야. 다영 책임님 말처럼.", next:"c3_c2" },
  c3_c2:{ sprite:"song", speaker:"song",
          text:"혼자 안 해도 된다는 게… 좀 안심이 되네요.", next:"c3_end" },
  c3_end:{ sprite:null, speaker:null,
           text:"송성무는 처음으로 남에게 손을 내밀었고, 막혔던 일은 풀렸다.", next:"c4card" },

  /* ── 제4화: 김주현 — 거리 두기의 기술 ── */
  c4card:{ chapter:"제4화 · 거리 두기의 기술", chapterCard:{k:"제 4 화", t:"거리 두기의 기술"}, bg:"office", next:"c4_1" },
  c4_1:{ bg:"office", sprite:null, speaker:null,
         text:"새 매니저 김주현이 합류했다. 점심시간마다 그는 같은 말을 반복했다.", next:"c4_2" },
  c4_2:{ sprite:"kim", speaker:"kim",
         text:"저 점심 따로 먹겠습니다!", next:"c4_3" },
  c4_3:{ sprite:"song", speaker:"song", face:"anxious",
         text:"(내가 뭔가 실수했나… 왜 자꾸 거리를 두는 거지. 역시 나는…)", next:"c4_4" },
  c4_4:{ sprite:null, speaker:null,
         text:"알고 보니 김주현은 점심시간에 혼자 자료를 파고드는, 자기 방식대로 몰입하는 사람이었다.", next:"c4_5" },
  c4_5:{ sprite:"kim", speaker:"kim",
         text:"오해는 마세요. 사람이 싫은 게 아니라, 전 혼자일 때 가장 잘 돼서요.", next:"c4_6" },
  c4_6:{ sprite:"choi", speaker:"choi",
         text:"(송쌩무이가 처음으로 ‘이해 안 되는 사람’을 만났네. 이번엔 네가 풀 차례야.)", next:"c4Choice" },
  c4Choice:{ sprite:"choi", speaker:"choi", text:"(뭐라고 조언할까…)",
    choices:[
      { label:"“친해지려 애쓰지 마. 결과로 신뢰를 쌓으면 돼.”",     effect:{skill:2}, next:"c4_a1" },
      { label:"“네 방식이 그 사람과 다른 것뿐이야. 네 페이스 지켜.”", effect:{conf:2},  next:"c4_b1" },
      { label:"“거리를 존중하면서도, 곁은 둬.”",                   effect:{team:2},  next:"c4_c1" },
    ]},
  c4_a1:{ sprite:"choi", speaker:"choi",
          text:"억지로 어울리지 않아도 돼. 일에서 신뢰가 쌓이면 그게 동료지.", next:"c4_a2" },
  c4_a2:{ sprite:"song", speaker:"song",
          text:"결과로 신뢰를 쌓는다… 그건 제가 할 수 있어요.", next:"c4_end" },
  c4_b1:{ sprite:"choi", speaker:"choi",
          text:"주현 매니저가 혼자가 편한 만큼, 너도 네 방식이 있는 거야. 비교할 필요 없어.", next:"c4_b2" },
  c4_b2:{ sprite:"song", speaker:"song",
          text:"맞아요. 다른 거지, 틀린 게 아니네요.", next:"c4_end" },
  c4_c1:{ sprite:"choi", speaker:"choi",
          text:"점심은 따로 먹어도, 일 끝나고 ‘수고했어요’ 한마디는 건네. 거리를 지키면서 곁을 두는 거지.", next:"c4_c2" },
  c4_c2:{ sprite:"kim", speaker:"kim",
          text:"…뭐, 그 정도는. 나쁘지 않네요.", next:"c4_end" },
  c4_end:{ sprite:null, speaker:null,
           text:"늘 자기만 챙김받던 송성무가, 처음으로 다른 사람을 헤아리는 자리에 섰다. ‘나만 나를 좋아해’라던 녀석이.", next:"clcard" },

  /* ── 제5화(클라이맥스): 이번엔 네가 발표해 ── */
  clcard:{ chapter:"제5화 · 이번엔 네가 발표해", chapterCard:{k:"제 5 화", t:"이번엔 네가 발표해"}, bg:"meeting", next:"cl_1" },
  cl_1:{ bg:"meeting", sprite:null, speaker:null,
         text:"마침내 프로젝트 최종 발표일. 원래 발표는 최수혁의 몫이었다.", next:"cl_2" },
  cl_2:{ sprite:"choi", speaker:"choi",
         text:"송쌩무이. 이번 발표, 네가 해.", next:"cl_3" },
  cl_3:{ sprite:"song", speaker:"song", face:"anxious",
         text:"네?! 제가요? 그건 책임님이 하셔야…", next:"cl_4" },
  cl_4:{ sprite:"choi", speaker:"choi",
         text:"지난 몇 달, 네가 누구보다 이 프로젝트를 잘 알아. 난 뒤에 있을게.", next:"cl_5" },
  cl_5:{ sprite:null, speaker:null,
         text:"송성무가 자료를 손에 쥐었다. 그가 어떤 발표를 하게 될지는 — 지난 시간 무엇을 쌓아왔는지에 달려 있었다.", next:"cl_branch" },
  cl_branch:{ branch:true },

  /* ── 엔딩 A: 자립(진엔딩) ── */
  endA1:{ bg:"meeting", sprite:"song", speaker:null,
          text:"송성무는 떨림 없이 발표를 시작했다. 날카로운 질문이 날아와도, 자기 근거로 차분히 받아쳤다.", next:"endA2" },
  endA2:{ sprite:"ahn", speaker:"ahn",
          text:"…쟤, 언제 저렇게 컸대. 끝나면 오징어회 한 접시 더 시켜야겠네.", next:"endA3" },
  endA3:{ sprite:null, speaker:null,
          text:"발표는 성공했다. 그날 밤, 송성무는 혼술바에 가지 않았다. 팀이 회식을 잡았으니까.", next:"endA4" },
  endA4:{ sprite:"song", speaker:"song", face:"smile",
          text:"이제 송쌩무이 말고 송 매니저라고 불러주셔도 되는데요.", next:"endA5" },
  endA5:{ sprite:"choi", speaker:"choi",
          text:"…아직 송쌩무이가 좋은데.", next:"endA6" },
  endA6:{ sprite:null, speaker:null,
          text:"‘나만 나를 좋아해’라던 녀석이, 어느새 자기를 좋아하게 됐다. 멘토가 손을 놓아도 되는 순간이었다.", ending:"growth" },

  /* ── 엔딩 B: 번아웃 ── */
  endB1:{ bg:"meeting", sprite:"song", speaker:null,
          text:"송성무는 발표를 완벽하게 해냈다. 단 한 글자도 틀리지 않았다.", next:"endB2" },
  endB2:{ sprite:null, speaker:null,
          text:"그리고 발표가 끝난 직후, 그는 자리에서 조용히 무너졌다. 인정받으려 모든 걸 혼자 짊어진 대가였다.", next:"endB3" },
  endB3:{ sprite:"choi", speaker:"choi",
          text:"(일은 됐는데… 또 혼자 다 떠안았어. 자길 제일 안 좋아한 사람은, 끝까지 자기 자신이었네.)", ending:"burnout" },

  /* ── 엔딩 C: 동반성장 ── */
  endC1:{ bg:"meeting", sprite:"song", speaker:null,
          text:"발표는 송성무 혼자가 아니라, 강지원·김주현과 나눠서 진행됐다.", next:"endC2" },
  endC2:{ sprite:"song", speaker:"song",
          text:"이 부분은 저보다 지원 매니저가 더 잘 압니다. 지원 매니저?", next:"endC3" },
  endC3:{ sprite:"kang", speaker:"kang",
          text:"네! 제가 설명드릴게요.", next:"endC4" },
  endC4:{ sprite:null, speaker:null,
          text:"프로젝트는 팀의 이름으로 성공했다. 송성무는 그제야 알았다. 혼자가 아니었다는 걸.", next:"endC5" },
  endC5:{ sprite:"joo", speaker:"joo",
          text:"사람은 가르치면서 가장 많이 배워. …너 가르치다가 우리도 다 너 좋아하게 된 거, 알지?", ending:"together" },
};

const START_NODE = "p1";

/* ================= 엔진 ================= */
const $ = id => document.getElementById(id);
const STAT_MAX = 8; // 게이지 상한
let stats = { conf:0, skill:0, team:0 };
let cur = null, typing=false, fullText="", typer=null;
let curChapter = "";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setBackground(key){
  if(!key) return;
  const bg = BACKGROUNDS[key]; if(!bg) return;
  $("bgLabel").textContent = "[배경: "+bg.label+"]";
  if(bg.img){ $("bgImg").src=bg.img; $("bgImg").style.display="block"; $("bgLabel").style.display="none"; }
  else { $("bgImg").style.display="none"; $("bgLabel").style.display=""; $("scene").style.background=bg.grad; }
}
function fillPlaceholder(c){
  $("plRing").textContent=c.initial; $("plRing").style.borderColor=c.color; $("plRing").style.color=c.color;
  $("plName").textContent=c.name; $("spritePlaceholder").style.borderColor=c.color;
}
function setSprite(key, face){
  const wrap=$("sprite-wrap"), si=$("spriteImg"), ph=$("spritePlaceholder");
  if(!key){ wrap.classList.add("sprite-hidden"); return; }
  const c=CHARACTERS[key]; if(!c) return;
  fillPlaceholder(c);
  const img = (face && FACES[key] && FACES[key][face]) || c.img;
  if(img){
    si.onload =()=>{ si.style.display="block"; ph.style.display="none"; };
    si.onerror=()=>{ si.style.display="none";  ph.style.display="flex"; };  // 파일 없으면 박스로
    si.style.display="none"; ph.style.display="flex";
    si.src=img;
  } else {
    si.style.display="none"; ph.style.display="flex";
  }
  wrap.classList.remove("sprite-hidden");
}
function setNameTag(speaker){
  const tag=$("nametag");
  if(!speaker){ tag.classList.add("hide"); $("text").classList.add("narration"); return; }
  const c=CHARACTERS[speaker];
  tag.classList.remove("hide"); $("text").classList.remove("narration");
  tag.textContent = c.title ? (c.name+" "+c.title) : c.name; tag.style.background=c.color;
  $("dialogue").style.borderTopColor=c.color;
}
function typeText(t){
  fullText=t; $("text").textContent=""; $("next").classList.remove("show");
  if(reduceMotion){ $("text").textContent=t; typing=false; $("next").classList.add("show"); return; }
  typing=true; let i=0;
  clearInterval(typer);
  typer=setInterval(()=>{
    $("text").textContent += t[i++];
    if(i>=t.length){ clearInterval(typer); typing=false; $("next").classList.add("show"); }
  },20);
}
function finishTyping(){ clearInterval(typer); $("text").textContent=fullText; typing=false; $("next").classList.add("show"); }

function renderStats(deltas){
  const map={conf:["bConf","vConf","tConf"],skill:["bSkill","vSkill","tSkill"],team:["bTeam","vTeam","tTeam"]};
  for(const k in map){
    const [bar,val,toast]=map[k];
    $(bar).style.width = Math.min(100, stats[k]/STAT_MAX*100)+"%";
    $(val).textContent = stats[k];
    if(deltas && deltas[k]){
      const el=$(toast); el.textContent="+"+deltas[k];
      el.style.animation="none"; void el.offsetWidth; el.style.animation="floatUp 1.3s ease forwards";
    }
  }
}
function applyEffect(eff){
  if(!eff) return;
  if(eff.conf) stats.conf+=eff.conf;
  if(eff.skill) stats.skill+=eff.skill;
  if(eff.team) stats.team+=eff.team;
  renderStats(eff);
}

function showChapterCard(cc, nextId){
  $("ccK").textContent=cc.k; $("ccT").textContent=cc.t;
  $("chapterCard").classList.add("show");
  const go=()=>{ $("chapterCard").classList.remove("show"); $("chapterCard").onclick=null; go.done=true; render(nextId); };
  $("chapterCard").onclick=go;
}

function showChoices(node){
  const box=$("choices"); box.innerHTML=""; box.classList.add("show");
  node.choices.forEach(ch=>{
    const b=document.createElement("button");
    b.className="choice"; b.textContent=ch.label;
    b.onclick=()=>{ box.classList.remove("show"); applyEffect(ch.effect); render(ch.next); };
    box.appendChild(b);
  });
  box.querySelector(".choice").focus();
}

function render(id){
  const node=STORY[id]; if(!node) return;
  cur=id;
  if(node.chapter){ curChapter=node.chapter; }
  $("chapterLabel").textContent=curChapter;

  if(node.branch){ render(decideEnding()); return; }   // 스탯에 따라 엔딩 분기
  if(node.chapterCard){ if(node.bg) setBackground(node.bg); showChapterCard(node.chapterCard, node.next); return; }
  if(node.bg) setBackground(node.bg);
  setSprite(node.sprite ?? null, node.face);
  setNameTag(node.speaker ?? null);
  typeText(node.text || "");

  if(node.choices){
    // 대사 다 나온 뒤 선택지 표시
    const wait=()=>{ if(typing){ setTimeout(wait,80); } else { showChoices(node); } };
    setTimeout(wait, reduceMotion?0:200);
  }
}

function advance(){
  if($("choices").classList.contains("show")) return;
  if($("chapterCard").classList.contains("show")) { $("chapterCard").click(); return; }
  if(typing){ finishTyping(); return; }
  const node=STORY[cur];
  if(node.choices) return;
  if(node.ending){ showEnd(node.ending); return; }
  if(node.next) render(node.next);
}

const ENDINGS = {
  growth:   { kicker:"엔딩 1 / 3", title:"나도 나를 좋아해 엔딩", blurb:"송성무는 알았다. 정작 자기를 제일 안 좋아한 건 자기였다는 걸. 이제 그가 누군가의 사수가 된다." },
  together: { kicker:"엔딩 2 / 3", title:"다들 나를 좋아해 엔딩", blurb:"혼자가 아니었다. 송성무도, 최수혁도, 팀도 함께 자랐다. 가장 단단한 결말." },
  burnout:  { kicker:"엔딩 3 / 3", title:"번아웃 엔딩", blurb:"인정받으려 또 혼자 다 떠안았다. 자길 제일 안 좋아한 사람은, 끝까지 자기 자신이었다." },
};
// 누적 스탯으로 엔딩 노드를 결정
function decideEnding(){
  const {conf,skill,team}=stats;
  const max=Math.max(conf,skill,team);
  if(skill===max && conf<=2 && team<=2) return "endB1";  // 실무력만 솟고 자신감·팀워크 바닥 → 번아웃
  if(team===max) return "endC1";                          // 팀워크 주도/균형 → 동반성장
  return "endA1";                                         // 자신감·실무 균형 → 자립(진)
}
function showEnd(key){
  const e=ENDINGS[key]||ENDINGS.growth;
  $("endKicker").textContent=e.kicker; $("endTitle").textContent=e.title; $("endBlurb").textContent=e.blurb;
  $("eConf").textContent=stats.conf; $("eSkill").textContent=stats.skill; $("eTeam").textContent=stats.team;
  $("ebConf").style.width=Math.min(100,stats.conf/STAT_MAX*100)+"%";
  $("ebSkill").style.width=Math.min(100,stats.skill/STAT_MAX*100)+"%";
  $("ebTeam").style.width=Math.min(100,stats.team/STAT_MAX*100)+"%";
  $("endScreen").classList.remove("hide");
}

function startGame(){
  stats={conf:0,skill:0,team:0}; renderStats(null);
  $("titleScreen").classList.add("hide"); $("endScreen").classList.add("hide");
  render(START_NODE);
}

/* 이벤트 */
$("dialogue").addEventListener("click", advance);
$("startBtn").addEventListener("click", startGame);
$("restartBtn").addEventListener("click", startGame);
$("resetBtn").addEventListener("click", ()=>{ if(confirm("처음부터 다시 시작할까요?")) startGame(); });
document.addEventListener("keydown", e=>{
  if(e.key===" "||e.key==="Enter"){
    if(!$("titleScreen").classList.contains("hide")){ startGame(); e.preventDefault(); return; }
    if(!$("endScreen").classList.contains("hide")){ startGame(); e.preventDefault(); return; }
    advance(); e.preventDefault();
  }
});
renderStats(null);
</script>
